name: Public Update Release Integrity

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit published updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event_path = os.environ["EVENT_PATH"]

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "AutoNovel-Update-integrity",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def get_bytes(url):
              req = urllib.request.Request(url, headers={"User-Agent": "AutoNovel-Update-integrity"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read()

          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)

          release = event.get("release")
          if release is None:
              release = get_json(f"https://api.github.com/repos/{repo}/releases/latest")

          tag = release["tag_name"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          version = tag[1:]

          expected_installer = f"AN_{version}_x64-setup.exe"
          expected = {
              "latest.json",
              expected_installer,
              f"{expected_installer}.sig",
              f"{expected_installer}.sha256",
          }

          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          missing = expected - set(assets)
          if missing:
              raise SystemExit(f"missing canonical updater assets: {sorted(missing)}")

          manifest = json.loads(get_bytes(assets["latest.json"]["browser_download_url"]).decode("utf-8-sig"))
          if manifest.get("version") != version:
              raise SystemExit("latest.json version does not match release tag")

          platforms = manifest.get("platforms")
          if not isinstance(platforms, dict) or "windows-x86_64" not in platforms:
              raise SystemExit("latest.json is missing windows-x86_64")
          platform = platforms["windows-x86_64"]
          signature = platform.get("signature")
          if not isinstance(signature, str) or not signature.strip():
              raise SystemExit("latest.json signature is empty")

          expected_url = f"https://github.com/{repo}/releases/download/{tag}/{expected_installer}"
          if platform.get("url") != expected_url:
              raise SystemExit("latest.json installer URL is not canonical")

          installer = get_bytes(assets[expected_installer]["browser_download_url"])
          digest = hashlib.sha256(installer).hexdigest()
          expected_digest = get_bytes(assets[f"{expected_installer}.sha256"]["browser_download_url"]).decode("ascii").strip().lower()
          if digest != expected_digest:
              raise SystemExit("installer SHA256 mismatch")

          detached_signature = get_bytes(assets[f"{expected_installer}.sig"]["browser_download_url"]).decode("utf-8-sig").strip()
          if detached_signature != signature.strip():
              raise SystemExit("latest.json signature does not match detached .sig asset")

          print(f"PASS: {tag} canonical public updater release structure and SHA256 are valid")
